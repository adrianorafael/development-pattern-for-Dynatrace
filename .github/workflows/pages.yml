# Publishes docs/ to the gh-pages branch, which GitHub Pages serves.
#
# Why a branch and not actions/deploy-pages: creating a Pages site through the
# REST API requires admin permission on the repository, which GITHUB_TOKEN never
# has -- actions/configure-pages with `enablement: true` fails with "Resource not
# accessible by integration". Pushing a gh-pages branch enables Pages without any
# manual step, so that is what this does.
#
# docs/ stays the single source of truth; gh-pages is generated and force-pushed.
#
# Only the default branch publishes. Triggering on feature branches too made every
# push run the job twice, each force-pushing gh-pages, so the first Pages build was
# cancelled mid-flight by the second -- noisy, and briefly racy.

name: Publish project page

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-page
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the gh-pages tree from docs/
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/site"
          cp -r docs "$RUNNER_TEMP/site"
          # Skip Jekyll: the page is plain HTML and needs no preprocessing.
          touch "$RUNNER_TEMP/site/.nojekyll"

      - name: Force-push it to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/site"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish project page from ${GITHUB_SHA:0:7}"
          git push -f \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
