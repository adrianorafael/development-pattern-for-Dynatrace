# Publishes docs/ to GitHub Pages.
#
# actions/configure-pages with `enablement: true` turns GitHub Pages on for the
# repository if it is not already enabled, so this workflow bootstraps the site
# without anyone touching Settings -> Pages.
#
# It runs from whichever branch is the repository default, which is what the
# github-pages environment's deployment branch policy allows.

name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment that is already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages (enables it if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload docs/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
